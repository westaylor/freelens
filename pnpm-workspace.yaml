allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: true
  node-pty: true
  sharp: true

engineStrict: true

nodeGyp: ../../../../node-gyp/bin/node-gyp.js

overrides:
  '@types/http-proxy': '-'
  # Internal-fork hardening (_security-review/02-supply-chain-audit.md):
  # transitive-dep CVE overrides. Each line is a vulnerable transitive
  # we have no direct control over; we pin every consumer to the
  # patched version. Refresh this list against `pnpm audit` whenever
  # we bump deps.
  brace-expansion@^1: ^1.1.13
  brace-expansion@^2: ^2.1.0
  brace-expansion@^4: ^5.0.5
  ajv@^6: ^6.14.0
  ajv@^7: ^8.18.0
  ajv@^8: ^8.18.0
  qs@^6: ^6.14.2
  yaml@^1: ^1.10.3
  picomatch@^2: ^2.3.2
  picomatch@^4: ^4.0.4
  minimatch@^3: ^3.1.4
  minimatch@^5: ^5.1.8
  minimatch@^9: ^9.0.7
  minimatch@^10: ^10.2.3
  follow-redirects: ^1.16.0
  dompurify: ^3.4.1
  diff@^4: ^4.0.4
  '@tootallnate/once@^1': ^3.0.1
  # uuid: bump everything to 14 to clear the v3/v5/v6 buf-bounds CVE.
  # Freelens consumers all use v4 (random) so the buf param is not in
  # play, but we lift everyone to the patched line for cleanliness.
  uuid@^3: ^14.0.0
  uuid@^8: ^14.0.0
  uuid@^9: ^14.0.0
  uuid@^11: ^14.0.0
  uuid@^13: ^14.0.0
  # express transitively pulls path-to-regexp@0.x via webpack-dev-server.
  # Lift it to a patched 0.x release.
  path-to-regexp@^0: ^0.1.13
  # @xmldom/xmldom: pulled in by electron-builder>app-builder-lib>plist.
  '@xmldom/xmldom@^0.8': ^0.8.13
  postcss@^8: ^8.5.10
  js-yaml@^3: ^3.14.2
  # Existing freelens overrides (unchanged):
  compression: ^1.8.1
  form-data: ^4.0.5
  http-proxy: npm:http-proxy-node16@^1.0.6
  http-proxy-middleware: ^3.0.5
  tmp@^0.2.0: ^0.2.5

packages:
  - freelens
  - packages/**

patchedDependencies:
  '@async-fn/jest': patches/@async-fn__jest.patch
  circular-dependency-plugin: patches/circular-dependency-plugin.patch

publicHoistPattern:
  - node-gyp

shellEmulator: true
