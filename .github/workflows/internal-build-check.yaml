# Internal-fork hardening: smoke-test build on every push to internal/*.
#
# Purpose: don't ship an unbuildable fork. Run `pnpm install + pnpm
# build:di + pnpm turbo run build` so we catch type / dep / packaging
# regressions before someone tries to release a binary.
#
# Cost: Linux-only, ~6 min per push, ~60 min/week. Sized within the
# GitHub Free 2,000 min/month private-repo budget; free on public.
#
# Required secrets: none.

name: Internal — build check

on:
  push:
    branches:
      - "internal/**"
      - main
  pull_request:
    branches:
      - "internal/**"
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: internal-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      DO_NOT_TRACK: "1"
      # Skip the build-time binary downloads (kubectl/helm/freelens-k8s-proxy).
      # We're verifying TypeScript / packaging, not shipping binaries.
      LENS_SKIP_DOWNLOAD_BINARIES: "true"
      TURBOREPO_CACHE: ${{ github.workspace }}/.turbo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Use pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: pnpm-build-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-build-

      - name: Use turbo cache
        uses: actions/cache@v5
        with:
          path: ${{ env.TURBOREPO_CACHE }}
          key: turbo-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: turbo-

      # Match upstream's install pattern: try once, retry on failure.
      # The first install can race when bin/ symlinks haven't fully
      # propagated; the retry is reliably idempotent.
      - name: Install
        id: install-pnpm
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install (retry)
        if: steps.install-pnpm.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile

      - name: Generate DI registrations
        run: pnpm build:di

      # IMPORTANT: use the root `pnpm build` script (which is
      # `turbo run build --`), NOT `pnpm turbo run build`. The
      # difference matters: when invoked as a script defined in the
      # root package.json, pnpm sets up the workspace bin context
      # before turbo starts spawning child tasks. Calling turbo
      # directly via `pnpm turbo run` triggers an intermittent race
      # where some packages' bin/ symlinks (tsc, webpack, etc.) are
      # not yet visible by the time turbo posix-spawns them, manifesting
      # as "command finished with error: No such file or directory
      # (os error 2)" on packages like @freelensapp/ensure-binaries,
      # @freelensapp/semver, @freelensapp/openid-client,
      # @freelensapp/node-fetch.
      - name: Build all packages
        run: pnpm --color=always --stream build

      - name: Sanity-check audit (production)
        run: |
          set -o pipefail
          pnpm audit --prod --json > audit.json || true
          critical=$(jq '.metadata.vulnerabilities.critical' audit.json)
          high=$(jq '.metadata.vulnerabilities.high' audit.json)
          echo "Production CVEs: critical=$critical high=$high"
          if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ]; then
            echo "::warning::Production audit found $critical critical / $high high CVEs (see internal-security-audit workflow)"
          fi
